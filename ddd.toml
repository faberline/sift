]
subject = "application->infrastructure"
reason = "§2 splits durability.rs and lib.rs's DurableJournal so the use cases (recover, append_durable_batch, the dedupe window upkeep and rebuild, adopt_archive_*, retention expiration, checkpoint_identity, restore and query_events) stay impl DurableJournal blocks over the infrastructure facade, reading its RawStorage, SignalWal, DedupeIndex, JournalHead file and CanonicalRecoveryReader, and CommitContext holds the DurableJournal and the SiftStateMachine; §2 wins over layer_deps here. P2: the use cases become application services over domain ports (event store, dedupe index, recovery reader, command committer) that durable_journal, the storage and the Raft state machine implement."

[[exceptions]]
rule = "B3"
paths = ["src/journal/infrastructure/raft/command_committer.rs"]
subject = "infrastructure->application"
reason = "command_committer is an impl CommitContext block whose commit_command proposes a SiftCommandV1 through Raft or applies it locally; §2 puts CommitContext in application with commit_append_batch and command_committer in infrastructure, and wins over layer_deps here. P2: a command-committer port in the domain that the Raft infrastructure implements and CommitContext holds."

[[exceptions]]
rule = "B3"
paths = ["src/journal/interfaces/journal_metrics.rs"]
subject = "interfaces->infrastructure"
