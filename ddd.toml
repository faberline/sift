# Sift's bounded contexts and layers, checked by the workspace's
# rust-arch contract (scripts/meta/rust_arch_contract.py). The [policy] table
# is copied verbatim from the canonical policy.toml; everything after it is
# Sift's own.
schema = 1

# Enforced since the DDD split's first phase (P1) finished: the check fails on
# any error that no [[exceptions]] entry below records. The ratchet never lets
# this go back to false.
[migration]
enforce = true

[policy]
version = 1
size_warn = 400
size_error = 1000
root_md = [
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CLAUDE.md",
  "AGENTS.md",
  # Temporary: the current project docs contract requires these at the root.
  "STATUS.md",
  "ROADMAP.md",
]
docs_required = [
  "docs/README.md",
  "docs/architecture.md",
  "docs/glossary.md",
  "docs/domain/",
  "docs/adr/",
  "docs/operations/",
]
layers = ["domain", "application", "infrastructure", "interfaces"]
# The layer held to the [policy.domain] purity rules and kept free of other contexts.
domain_layer = "domain"
# Layers another context may use. A context without any of them exposes its whole public API.
public_layers = ["application"]
# <ctx>/domain/events(.rs|/) is the only domain module other contexts may use.
domain_events = "events"
# A tests/<name>.rs binary may stand alone only when it is the crate's single test
# target, contains one of these markers, or its leading //! block carries
# `//! isolation: <reason>`. Everything else lives in tests/it/.
test_isolation_markers = ["set_var(", "remove_var(", "#[global_allocator]"]
# tests/<dir>/ names holding .rs data (fixtures, trybuild cases), not test targets.
test_data_dirs = ["fixtures", "compile_fail", "ui"]
# false: one crate may hold several contexts (B3/B4 still guard each boundary).
# true: B1 requires every crate to belong to exactly one context.
one_context_per_crate = false

# Layers each layer may use inside one context. The shared kernel is usable by
# every layer; assembly code (lib.rs, main.rs, src/bin) is unrestricted. A
# multi-file binary is src/bin/<name>/main.rs plus sibling modules: B6 keeps
# the entry file thin and does not apply to those modules.
[policy.layer_deps]
domain = []
application = ["domain"]
infrastructure = ["domain"]
interfaces = ["application"]

[policy.domain]
# Applies to every domain layer, and to the shared kernel when shared_kernel_pure.
allowed_crates = [
  "std",
  "core",
  "alloc",
  "thiserror",
  "serde",
  "serde_json",
  "chrono",
  "time",
  "uuid",
  "sha2",
  "hex",
  "regex",
  "bytes",
]
denied_paths = [
  "std::fs",
  "std::net",
  "std::process",
  "std::env",
  "std::os",
  "std::io::stdin",
  "std::io::stdout",
  "std::io::stderr",
  "std::thread::spawn",
  "std::thread::sleep",
  "std::time::SystemTime::now",
  "std::time::Instant::now",
  "chrono::Utc::now",
  "chrono::Local::now",
  "chrono::offset::Utc::now",
  "chrono::offset::Local::now",
  "time::OffsetDateTime::now_utc",
  "time::OffsetDateTime::now_local",
  "time::Instant::now",
  "uuid::Uuid::now_v7",
  "uuid::Uuid::new_v4",
]
denied_macros = ["println", "print", "eprintln", "eprint", "dbg"]
shared_kernel_pure = true

[policy.naming]
crates_dir = "crates"
domain_crate = "{repo}-{context}-domain"
context_crate = "{repo}-{context}"
shared_kernel_crate = "{repo}-shared-kernel"

# Module layout (no mod.rs) is enforced by clippy, not by this checker.
[policy.lints.clippy]
mod_module_files = "deny"

# The published language every context shares: the versioned operational
# event, the stored event a cursor points at, and the digests, watermarks and
# ids that journal, archive and query agree on.
[shared_kernel]
path = "src/shared_kernel"

# Kernel dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.



# The assembly root: the service state every context's handlers share, the
# readiness and metrics hooks, and the HTTP router, API error and OpenAPI
# document. Like lib.rs and the bin it wires the contexts together, so the
# layer and context rules do not apply to it.
[assembly]
modules = ["src/app"]

# The collector: the agent that reads service logs from a file, stdin or a
# node's CRI log root and delivers them to Sift over OTLP. It reads nothing
# of Sift's but the shared kernel.
[[contexts]]
name = "collector"
depends_on = []

[contexts.layers]
domain = "src/collector/domain"
application = "src/collector/application"
infrastructure = "src/collector/infrastructure"

# Collector dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.



# Projections: the logging, metric and trace read models Sift builds from the
# journal and answers queries from. Besides the shared kernel they read the
# journal they are built from.
[[contexts]]
name = "projection"
depends_on = ["journal"]

[contexts.layers]
domain = "src/projection/domain"
application = "src/projection/application"
infrastructure = "src/projection/infrastructure"
interfaces = "src/projection/interfaces"

# Projection dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.





# Queries: the versioned query API over logs, metrics and traces, its async
# jobs, the Prometheus-compatible endpoints, the query role and the
# read-only MCP tools. It reads the projections it answers from, the journal
# for the services it lists, the archive for cold queries, access for the
# project checks its handlers run, and operations for the router that forwards
# the query role's other routes to the store role.
[[contexts]]
name = "query"
depends_on = ["projection", "journal", "archive", "access", "operations"]

[contexts.layers]
domain = "src/query/domain"
application = "src/query/application"
infrastructure = "src/query/infrastructure"
interfaces = "src/query/interfaces"

# Query dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.






[[exceptions]]
rule = "B3"
paths = ["src/query/interfaces/http/query_role_router.rs", "src/query/interfaces/mcp/mcp_transport.rs", "src/query/interfaces/mcp/sift_mcp_server.rs"]
subject = "interfaces->infrastructure"
reason = "query_role_query_v1 calls forward_query_to_store and decode_store_query_response, and serve_stdio and http_router build the SiftApiClient that SiftMcpServer holds and calls; P1 moves the handlers and the MCP server whole. P2: application ports for forwarding a query to the store and for reaching the Sift API, with the composition root injecting store_query_client and SiftApiClient behind them."





[[exceptions]]
rule = "B4"
paths = ["src/query/interfaces/http/query_role_router.rs"]
subject = "operations.interfaces"
reason = "query_role_router falls back to query_router, the gateway proxy's reverse-proxy router to the store role, for every route the query role does not answer itself; P1 moves proxy.rs to operations' interfaces and the query role router keeps calling it. P2: the composition root builds the store-forwarding router and passes it to query_role_router, so query no longer names operations and drops it from depends_on."

# Ingest: telemetry admitted within bounded limits, decoded from OTLP, Cloud
# Logging structured JSON and Prometheus remote write into operational
# events, governed, and appended through the group-commit queue to the
# journal. Besides the shared kernel it appends to the journal, runs access's
# project checks, and runs on the app's ServiceState and ApiError, which are
# assembly code the context rules do not cover.
[[contexts]]
name = "ingest"
depends_on = ["journal", "access"]

[contexts.layers]
domain = "src/ingest/domain"
application = "src/ingest/application"
infrastructure = "src/ingest/infrastructure"
interfaces = "src/ingest/interfaces"

# Ingest dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.





# The journal: Sift's durable, replicated event log. It accepts governed
# batches through Raft, deduplicates them inside the idempotency window,
# recovers from the WAL and sealed segments, adopts archive checkpoints and
# retention, and serves reads to the projections and queries. It opens its
# data root through the node. Besides the shared kernel and the node it
# reaches the archive and ingest's governance, as the exceptions below say.
[[contexts]]
name = "journal"
depends_on = ["node"]

[contexts.layers]
domain = "src/journal/domain"
application = "src/journal/application"
infrastructure = "src/journal/infrastructure"
interfaces = "src/journal/interfaces"

# Journal dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.









# The archive: Sift's cold tier. It uploads the journal's sealed segments,
# blobs and dedupe receipts to GCS or a local archive under a verified
# manifest, evicts archived segments from the hot tier, expires events past
# retention, garbage-collects blobs once every voter has checkpointed, restores
# an empty node from the archive, and replays archived events to cold queries.
# Its workers run the archive and lifecycle ticks. Besides the shared kernel
# it reads the journal it archives and restores into the node's data root.
[[contexts]]
name = "archive"
depends_on = ["journal", "node"]

[contexts.layers]
domain = "src/archive/domain"
application = "src/archive/application"
infrastructure = "src/archive/infrastructure"
interfaces = "src/archive/interfaces"

# Archive dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.



[[exceptions]]
rule = "B3"
paths = ["src/archive/application/archive_journal_local.rs", "src/archive/application/archive_journal_to_gcs.rs", "src/archive/application/archive_status_queries.rs", "src/archive/application/committed_event_reader.rs", "src/archive/application/evict_cold_segments.rs", "src/archive/application/finalize_archive_gc.rs", "src/archive/application/inspect_archive_catalog.rs", "src/archive/application/reconcile_committed_retention.rs", "src/archive/application/replay_committed_events.rs", "src/archive/application/replay_recent_committed.rs", "src/archive/application/restore_gcs.rs", "src/archive/application/restore_into_empty.rs", "src/archive/application/resume_local_blob_gc.rs", "src/archive/application/retention_catalog_ops.rs", "src/archive/application/retention_due.rs", "src/archive/application/retention_expiration.rs", "src/archive/application/retention_manifest_commit.rs", "src/archive/application/retention_pass.rs", "src/archive/application/rewrite_retained_segment.rs", "src/archive/application/run_lifecycle_attempt.rs", "src/archive/application/upload_archive_snapshot.rs"]
subject = "application->infrastructure"
reason = "§2 splits storage/archive.rs into use cases over the archive's control records and codecs: the upload, eviction, expiration, GC, restore, replay, retention and status use cases read and write ArchiveCommitState (read_commit_state, record_archive_commit), ArchiveUploadIntent, ArchiveGcPending, LocalBlobGcPending, LocalSegmentCommitState, RestoreState and the local blob live index; walk the catalog through SpillCatalog, load_archive_catalog and the GC plan builder; fetch the verified manifest and cache segments; and encode, decode and verify segments through SiftParquetCodec, ArchiveSignalStream and the integrity checks, with the control paths and private_fs_mode for the files they create. §2 wins over layer_deps here. P2: domain ports (commit store, upload-intent store, GC-plan store, catalog, manifest fetcher, segment codec) that these infrastructure modules implement, and the use cases take them."




[[exceptions]]
rule = "B4"
paths = ["src/archive/application/compact_journal.rs", "src/archive/application/prepare_retention_fence.rs", "src/archive/application/restore_into_empty.rs", "src/archive/application/run_lifecycle_attempt.rs"]
subject = "journal.infrastructure"
reason = "The archive use cases act on the journal's live stores: they take DurableJournal to capture, evict, expire, compact, reconcile and restore sealed segments, read segments and blobs through RawStorage and BlobStore, restore writes the epoch maps with write_epoch_maps, and the lifecycle, retention fence and compaction propose and apply through SiftStateMachine; P1 moves them as-is. P2: the journal's application exposes the snapshot, eviction, expiration, compaction and restore operations the archive needs, and the archive holds that port instead of DurableJournal, RawStorage and SiftStateMachine."

# The node: one Sift process's own data root. It owns the private, versioned
# data directory with its layout manifest, the role the process runs as, and
# the local disk-capacity guard. It has no application layer, so the journal
# and the archive use its domain and infrastructure directly.
[[contexts]]
name = "node"
depends_on = []

[contexts.layers]
domain = "src/node/domain"
infrastructure = "src/node/infrastructure"

# Access: who may call Sift, and for which project. It owns the auth
# configuration, the verifier that checks a bearer token against a static role
# map or the Kubernetes API server, the scoped bearer middleware, and the
# project and admin use cases shared by the HTTP and gRPC adapters.
[[contexts]]
name = "access"
depends_on = []

[contexts.layers]
application = "src/access/application"
domain = "src/access/domain"
infrastructure = "src/access/infrastructure"
interfaces = "src/access/interfaces"

# Access dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.





# Operations: running Sift as a service. It owns the Sift custom resource and
# the operator that reconciles it, the deployment artifacts rendered offline
# from checked-in templates, off-node snapshot backup and restore, the
# gateway's reverse-proxy route policy, the OTLP/gRPC proxy, and the admin
# backup and integrity endpoints. It reads the journal for snapshots and
# integrity reports, the archive for its committed state, and the node's
# layout manifest and runs access's shared authorization use cases.
[[contexts]]
name = "operations"
depends_on = ["journal", "archive", "node", "access"]

[contexts.layers]
domain = "src/operations/domain"
application = "src/operations/application"
infrastructure = "src/operations/infrastructure"
interfaces = "src/operations/interfaces"

# Operations dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.





# Files P2 moved or split. The ratchet lets each new path take the old path's
# place in the exceptions above; once main has the new paths these entries
# can go.

[[renames]]
from = "src/archive/application/replay_cold_query.rs"
to = ["src/query/application/replay_cold_query.rs"]

[[renames]]
from = "src/archive/application/expire_committed_events.rs"
to = [
  "src/archive/application/retention_expiration.rs",
  "src/archive/application/retention_pass.rs",
  "src/archive/application/rewrite_retained_segment.rs",
]

[[renames]]
from = "src/archive/interfaces/lifecycle_worker.rs"
to = [
  "src/archive/application/lifecycle_tick.rs",
  "src/archive/application/lifecycle_checkpoint.rs",
]

[[renames]]
from = "src/ingest/domain/raft_batch_splitter.rs"
to = ["src/ingest/application/raft_batch_splitter.rs"]
