  "src/archive/application/run_lifecycle_attempt.rs",
  "src/archive/application/upload_archive_snapshot.rs",
]
subject = "application->infrastructure"
reason = "§2 splits storage/archive.rs into use cases over the archive's control records and codecs: the upload, eviction, expiration, GC, restore, replay, retention and status use cases read and write ArchiveCommitState (read_commit_state, record_archive_commit), ArchiveUploadIntent, ArchiveGcPending, LocalBlobGcPending, LocalSegmentCommitState, RestoreState and the local blob live index; walk the catalog through SpillCatalog, load_archive_catalog and the GC plan builder; fetch the verified manifest and cache segments; and encode, decode and verify segments through SiftParquetCodec, ArchiveSignalStream and the integrity checks, with the control paths and private_fs_mode for the files they create. §2 wins over layer_deps here. P2: domain ports (commit store, upload-intent store, GC-plan store, catalog, manifest fetcher, segment codec) that these infrastructure modules implement, and the use cases take them."

[[exceptions]]
rule = "B3"
paths = [
  "src/archive/infrastructure/archive_commit_state.rs",
  "src/archive/infrastructure/archive_gc_pending_store.rs",
  "src/archive/infrastructure/archive_upload_intent.rs",
  "src/archive/infrastructure/local_blob_gc_store.rs",
]
subject = "infrastructure->application"
reason = "The commit-state, upload-intent, GC-pending and local-blob-GC stores persist or rebuild an ArchiveReceipt (record_archive_commit, adopt_verified_archive_receipt, the upload intent's recovery, archive_gc_pending_for_receipt, install_archive_gc_plan, local_blob_gc_pending_for_receipt), and §2.1 puts ArchiveReceipt in application with the other receipt DTOs; §2 wins over layer_deps here. P2: ArchiveReceipt moves to the archive domain as the committed-archive value the stores persist, and the application re-exports it with the other receipts."

[[exceptions]]
rule = "B3"
paths = ["src/archive/interfaces/lifecycle_worker.rs"]
subject = "interfaces->domain"
reason = "start_lifecycle_worker paces the all-voter checkpoint with ALL_VOTER_CHECKPOINT_ATTEMPT and bounds each GC batch with ARCHIVE_GC_BATCH_OBJECTS, which §2 puts in the domain's lifecycle_settings; §2 wins over layer_deps here. P2: the tick moves into the application (run_lifecycle_tick, E9), which reads the settings, and the worker only schedules it."

[[exceptions]]
rule = "B4"
paths = [
  "src/archive/application/archive_journal_local.rs",
  "src/archive/application/archive_journal_to_gcs.rs",
  "src/archive/application/archive_raw_storage_to_gcs.rs",
  "src/archive/application/expire_committed_events.rs",
  "src/archive/application/prepare_retention_fence.rs",
  "src/archive/application/replay_cold_query.rs",
  "src/archive/application/replay_recent_committed.rs",
  "src/archive/application/retention_due.rs",
  "src/archive/application/run_lifecycle_attempt.rs",
  "src/archive/application/upload_archive_snapshot.rs",
  "src/archive/infrastructure/dedupe_receipt_archive.rs",
  "src/archive/infrastructure/local_segment_commit_state.rs",
  "src/archive/interfaces/lifecycle_worker.rs",
]
subject = "journal.domain"
reason = "The archive stores the journal's own records: the uploads and the local commit state read the journal's SegmentManifest, the dedupe-receipt archive and replay hold DedupeReceipt, expiration and retention_due keep IDEMPOTENCY_WINDOW_SECONDS of receipts, the retention fence and the lifecycle build RetentionFenceV1 and propose SiftCommandV1 barriers, and replay_cold_query builds an EventQuery; P1 moves them as-is. P2: the journal's application publishes the segment manifest, dedupe receipt, idempotency window, retention fence and the commands the archive proposes, or they become shared kernel as the journal-archive published language."

[[exceptions]]
rule = "B4"
paths = [
  "src/archive/domain/archive_manifest.rs",
  "src/archive/domain/portable_manifest.rs",
]
subject = "journal.domain"
reason = "ArchiveManifest carries the journal's SegmentManifest list and EpochMap history as serialized fields, and portable_manifest rewrites a SegmentManifest's paths for the archive; the manifest JSON is the archive's format, so P1 moves it as-is. P2: SegmentManifest and EpochMap move to the shared kernel as the journal-archive published language."

[[exceptions]]
rule = "B4"
paths = [
  "src/archive/application/archive_journal_local.rs",
  "src/archive/application/archive_journal_to_gcs.rs",
  "src/archive/application/archive_raw_storage_to_gcs.rs",
  "src/archive/application/compact_journal.rs",
  "src/archive/application/evict_cold_segments.rs",
  "src/archive/application/expire_committed_events.rs",
  "src/archive/application/prepare_retention_fence.rs",
  "src/archive/application/reconcile_committed_retention.rs",
  "src/archive/application/restore_into_empty.rs",
  "src/archive/application/resume_local_blob_gc.rs",
  "src/archive/application/retention_manifest_commit.rs",
  "src/archive/application/run_lifecycle_attempt.rs",
  "src/archive/application/upload_archive_snapshot.rs",
]
subject = "journal.infrastructure"
reason = "The archive use cases act on the journal's live stores: they take DurableJournal to capture, evict, expire, compact, reconcile and restore sealed segments, read segments and blobs through RawStorage and BlobStore, restore writes the epoch maps with write_epoch_maps, and the lifecycle, retention fence and compaction propose and apply through SiftStateMachine; P1 moves them as-is. P2: the journal's application exposes the snapshot, eviction, expiration, compaction and restore operations the archive needs, and the archive holds that port instead of DurableJournal, RawStorage and SiftStateMachine."

[[exceptions]]
rule = "B4"
paths = ["src/archive/application/replay_cold_query.rs"]
subject = "query.application"
reason = "replay_cold_query, which §2.1 puts in the archive, returns ArchiveQueryStatus, the query's own cold-query outcome; declaring query in depends_on would close an archive-query cycle, since query reads the archive for cold queries. §2 wins over the dependency direction here. P2: replay_cold_query moves to query's application, which calls the archive's replay_committed_events and builds ArchiveQueryStatus itself."

[[exceptions]]
rule = "B4"
paths = ["src/archive/application/replay_cold_query.rs"]
subject = "query.interfaces"
reason = "replay_cold_query, which §2.1 puts in the archive, reads the project, environment and time range from QueryRequestV1, the query's HTTP request; declaring query in depends_on would close an archive-query cycle. P2: replay_cold_query moves to query's application, and the archive's replay_committed_events keeps taking the project, environment and time range as plain arguments."

[[exceptions]]
rule = "B4"
paths = ["src/archive/application/replay_cold_query.rs"]
subject = "projection.application"
reason = "replay_cold_query, which §2.1 puts in the archive, applies each replayed event to the query's &dyn Projection (apply_idempotent); P1 moves it as-is. P2: replay_cold_query moves to query's application, so the archive's replay only hands events to a callback and the archive no longer names the Projection trait."

# The node: one Sift process's own data root. It owns the private, versioned
# data directory with its layout manifest, the role the process runs as, and
# the local disk-capacity guard. It has no application layer, so the journal
# and the archive use its domain and infrastructure directly.
[[contexts]]
name = "node"
depends_on = []

[contexts.layers]
domain = "src/node/domain"
infrastructure = "src/node/infrastructure"

# Access: who may call Sift, and for which project. It owns the auth
# configuration, the verifier that checks a bearer token against a static role
# map or the Kubernetes API server, the scoped bearer middleware, and the
# project and admin checks handlers run. It has no application layer, so
# ingest and query use its interfaces directly.
[[contexts]]
name = "access"
depends_on = []

[contexts.layers]
domain = "src/access/domain"
infrastructure = "src/access/infrastructure"
interfaces = "src/access/interfaces"

# Access dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B2"
paths = ["src/access/domain/route_role.rs"]
subject = "axum"
reason = "http_role reads the request's axum::http::Method to decide whether a route needs Read or Write; P1 moves it from auth.rs as-is. P2: the domain takes a route kind (method and path as plain values) and the interfaces map the axum request onto it, or http's Method is approved in the domain allowlist."

[[exceptions]]
rule = "B2"
paths = ["src/access/domain/route_role.rs"]
subject = "service_auth"
reason = "http_role returns and role_verb takes service_auth::Role, the Read, Write and Admin roles the shared bearer middleware and RoleMapPrincipal enforce; the role is the shared auth crate's published contract, and P1 moves both as-is. P2: approve service_auth::Role in the domain allowlist, or give access a domain role that the interfaces map onto service_auth::Role."

[[exceptions]]
rule = "B3"
paths = ["src/access/interfaces/http/scoped_authorization.rs"]
subject = "interfaces->domain"
reason = "SiftVerifier's ScopedAuthorization impl calls http_role to pick the role a route needs before it authenticates the project; P1 moves the impl from auth.rs as-is. P2: access gets an application layer with an authorize_request use case that owns the route-to-role decision, and the middleware adapter calls it."

[[exceptions]]
rule = "B3"
paths = ["src/access/interfaces/http/scoped_authorization.rs"]
subject = "interfaces->infrastructure"
reason = "service_auth::ScopedAuthorization is implemented directly for SiftVerifier, the infrastructure verifier, and the impl calls its is_kubernetes and authenticate_project; the orphan rule keeps the impl beside a local type, and P1 moves it as-is. P2: the impl moves to a thin interfaces wrapper over an application authorize_request use case that holds the verifier behind a domain port."
