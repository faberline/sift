[[exceptions]]
rule = "B2"
paths = ["src/journal/domain/append_result.rs"]
subject = "utoipa"
reason = "AppendResult derives ToSchema and is re-exported as sift::AppendResult; no OpenAPI path registers it today, but dropping a derive from a public type is not a move (E1). P2: drop the derive if nothing registers the schema, or approve AppendResult as published language in the domain allowlist."

[[exceptions]]
rule = "B2"
