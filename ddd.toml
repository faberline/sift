# Sift's bounded contexts and layers, checked by the workspace's
# rust-arch contract (scripts/meta/rust_arch_contract.py). The [policy] table
# is copied verbatim from the canonical policy.toml; everything after it is
# Sift's own.
schema = 1

# Report only while the DDD split (P1) is in progress.
[migration]
enforce = false

[policy]
version = 1
size_warn = 400
size_error = 1000
root_md = [
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "CLAUDE.md",
  "AGENTS.md",
  # Temporary: the current project docs contract requires these at the root.
  "STATUS.md",
  "ROADMAP.md",
]
docs_required = [
  "docs/README.md",
  "docs/architecture.md",
  "docs/glossary.md",
  "docs/domain/",
  "docs/adr/",
  "docs/operations/",
]
layers = ["domain", "application", "infrastructure", "interfaces"]
# The layer held to the [policy.domain] purity rules and kept free of other contexts.
domain_layer = "domain"
# Layers another context may use. A context without any of them exposes its whole public API.
public_layers = ["application"]
# <ctx>/domain/events(.rs|/) is the only domain module other contexts may use.
domain_events = "events"
# A tests/<name>.rs binary may stand alone only when it is the crate's single test
# target, contains one of these markers, or its leading //! block carries
# `//! isolation: <reason>`. Everything else lives in tests/it/.
test_isolation_markers = ["set_var(", "remove_var(", "#[global_allocator]"]
# tests/<dir>/ names holding .rs data (fixtures, trybuild cases), not test targets.
test_data_dirs = ["fixtures", "compile_fail", "ui"]
# false: one crate may hold several contexts (B3/B4 still guard each boundary).
# true: B1 requires every crate to belong to exactly one context.
one_context_per_crate = false

# Layers each layer may use inside one context. The shared kernel is usable by
# every layer; assembly code (lib.rs, main.rs, src/bin) is unrestricted. A
# multi-file binary is src/bin/<name>/main.rs plus sibling modules: B6 keeps
# the entry file thin and does not apply to those modules.
[policy.layer_deps]
domain = []
application = ["domain"]
infrastructure = ["domain"]
interfaces = ["application"]

[policy.domain]
# Applies to every domain layer, and to the shared kernel when shared_kernel_pure.
allowed_crates = [
  "std",
  "core",
  "alloc",
  "thiserror",
  "serde",
  "serde_json",
  "chrono",
  "time",
  "uuid",
  "sha2",
  "hex",
  "regex",
  "bytes",
]
denied_paths = [
  "std::fs",
  "std::net",
  "std::process",
  "std::env",
  "std::os",
  "std::io::stdin",
  "std::io::stdout",
  "std::io::stderr",
  "std::thread::spawn",
  "std::thread::sleep",
  "std::time::SystemTime::now",
  "std::time::Instant::now",
  "chrono::Utc::now",
  "chrono::Local::now",
  "chrono::offset::Utc::now",
  "chrono::offset::Local::now",
  "time::OffsetDateTime::now_utc",
  "time::OffsetDateTime::now_local",
  "time::Instant::now",
  "uuid::Uuid::now_v7",
  "uuid::Uuid::new_v4",
]
denied_macros = ["println", "print", "eprintln", "eprint", "dbg"]
shared_kernel_pure = true

[policy.naming]
crates_dir = "crates"
domain_crate = "{repo}-{context}-domain"
context_crate = "{repo}-{context}"
shared_kernel_crate = "{repo}-shared-kernel"

# Module layout (no mod.rs) is enforced by clippy, not by this checker.
[policy.lints.clippy]
mod_module_files = "deny"

# The published language every context shares: the versioned operational
# event, the stored event a cursor points at, and the digests, watermarks and
# ids that journal, archive and query agree on.
[shared_kernel]
path = "src/shared_kernel"

# Kernel dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B2"
paths = ["src/shared_kernel/event.rs", "src/shared_kernel/stored_event.rs"]
subject = "utoipa"
reason = "OperationalEventV2, its parts and StoredEvent derive ToSchema because they are the published language: one serde shape is the WAL, segment, Raft and snapshot bytes, the digest input and the OpenAPI wire (E1). A mirror DTO would triple about 40 types and clone on every append and replay, and any drift in field order or skip rules changes the digest. P2: approve them as the published language individually and pin the bytes with golden tests."

[[exceptions]]
rule = "B2"
paths = [
  "src/shared_kernel/event.rs",
  "src/shared_kernel/event_content_digest.rs",
  "src/shared_kernel/single_signal_batch.rs",
]
subject = "anyhow"
reason = "Event validation, digest decode and the single-signal check return anyhow errors whose text reaches HTTP 400 bodies and that tests match by substring, so converting them is not a move (E6). P2: a kernel error type (thiserror) with the same Display text, which the callers convert."

[[exceptions]]
rule = "B2"
paths = ["src/shared_kernel/event.rs"]
subject = "clap"
reason = "SignalKind derives clap::ValueEnum so the CLI's --signal flags parse straight into it; the mapping keeps the derive (Q9). P2: approve it individually, or give the bin its own ValueEnum that maps onto SignalKind if the kernel must drop clap."

[[exceptions]]
rule = "B2"
paths = ["src/shared_kernel/event.rs"]
subject = "chrono::Utc::now"
reason = "OperationalEventV2::for_project (and ::new through it) stamps occurred_at and observed_at with Utc::now; P1 moves the constructors without rewriting them (E7). P2: a for_project_at(now) constructor in the kernel and a Clock port the callers pass the time through."

# The collector: the agent that reads service logs from a file, stdin or a
# node's CRI log root and delivers them to Sift over OTLP. It reads nothing
# of Sift's but the shared kernel.
[[contexts]]
name = "collector"
depends_on = []

[contexts.layers]
domain = "src/collector/domain"
application = "src/collector/application"
infrastructure = "src/collector/infrastructure"

# Collector dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B2"
paths = [
  "src/collector/domain/config.rs",
  "src/collector/domain/cri.rs",
  "src/collector/domain/service_log.rs",
]
subject = "anyhow"
reason = "CollectorConfig::validate, parse_cri_frame, parse_workload_path and the service-log validators return anyhow errors whose text is the CLI's error for a bad flag and the error a quarantine entry records for a rejected line, so converting them is not a move (E6). P2: a collector domain error (thiserror) with the same Display text, which the runtime and the bin convert."

[[exceptions]]
rule = "B2"
paths = ["src/collector/domain/service_log.rs"]
subject = "service_observability"
reason = "validate checks a StructuredServiceLogV1 against its schema id and the core crate's bounds (MAX_EVENT_BYTES, MAX_ATTRIBUTES and the rest): the log shape is the core library's published contract, not Sift's (E14). P2: approve service_observability in the domain allowlist, or wrap the log in a collector newtype if review wants the domain free of it."

[[exceptions]]
rule = "B3"
paths = ["src/collector/application/runtime.rs"]
subject = "application->infrastructure"
reason = "run opens its source with open_source and delivers through CollectorClient, SiftRecordDecoder maps each record with decode_service_log_enriched, and the truncated-file test seeds a CollectorCheckpoint; P1 moves runtime.rs whole. P2: the composition root opens the source and builds the client and passes them to run as service_collector's CollectorSource and BatchSink, the decoder takes the mapper injected, and the test moves with that wiring."

# Projections: the logging, metric and trace read models Sift builds from the
# journal and answers queries from. Besides the shared kernel they read the
# journal through DurableJournal, still a crate-root item; the journal
# becomes a context, and this one depends on it, in commit 6.
[[contexts]]
name = "projection"
depends_on = []

[contexts.layers]
domain = "src/projection/domain"
application = "src/projection/application"
infrastructure = "src/projection/infrastructure"
interfaces = "src/projection/interfaces"

# Projection dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B2"
paths = [
  "src/projection/domain/log.rs",
  "src/projection/domain/metric.rs",
  "src/projection/domain/metric_aggregation.rs",
  "src/projection/domain/metric_memory_size.rs",
  "src/projection/domain/metric_series.rs",
  "src/projection/domain/trace.rs",
]
subject = "anyhow"
reason = "The query validators (LogQuery, TraceQuery, MetricQuery), histogram validation and merging, series identity, chunk and size checks and the rollups return anyhow errors whose text is the API's invalid_query message and the error apply and restore report, so converting them is not a move (E6). P2: a projection domain error (thiserror) with the same Display text, which the runtime and the API convert."

[[exceptions]]
rule = "B2"
paths = [
  "src/projection/domain/log.rs",
  "src/projection/domain/metric.rs",
  "src/projection/domain/trace.rs",
]
subject = "utoipa"
reason = "The *V1 records, the queries and the pages derive ToSchema because they are the API's OpenAPI wire as well as the snapshot bytes and the semantic digest's input; a mirror DTO would triple them and risk the digest drifting (E1). P2: approve utoipa for the *V1 projection records in the domain allowlist, with golden-bytes tests."

[[exceptions]]
rule = "B3"
paths = ["src/projection/application/projection_runtime.rs"]
subject = "application->infrastructure"
reason = "ProjectionRuntime::open builds LoggingProjection, MetricProjection and TraceProjection, registers them with service_projection and reads the journal through JournalProjectionSource, and its fields hold handles to the three; P1 moves runtime.rs's runtime whole. P2: the composition root builds the projections and the journal source and passes them in, and the runtime holds them through a domain port."

[[exceptions]]
rule = "B3"
paths = [
  "src/projection/infrastructure/logging_projection.rs",
  "src/projection/infrastructure/metric_projection_apply.rs",
  "src/projection/infrastructure/service_projection_adapter.rs",
  "src/projection/infrastructure/trace_projection.rs",
]
subject = "infrastructure->application"
reason = "The three projections implement the Projection trait, service_projection_adapter binds that trait to service_projection's, and LoggingProjection maps each event with normalize; §2.7 puts the trait and the normalizer in application, and P1 follows it. P2: move the Projection trait into the domain as a port and log_record_normalizer with it, so infrastructure depends only on the domain."

# Queries: the versioned query API over logs, metrics and traces, its async
# jobs, the Prometheus-compatible endpoints, the query role and the
# read-only MCP tools. It reads the projections it answers from.
[[contexts]]
name = "query"
depends_on = ["projection"]

[contexts.layers]
domain = "src/query/domain"
application = "src/query/application"
infrastructure = "src/query/infrastructure"
interfaces = "src/query/interfaces"

# Query dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B2"
paths = [
  "src/query/domain/filter_evaluator.rs",
  "src/query/domain/filter_expression.rs",
  "src/query/domain/promql.rs",
  "src/query/domain/promql_evaluator.rs",
  "src/query/domain/query_cursor.rs",
  "src/query/domain/query_job.rs",
  "src/query/domain/query_time.rs",
]
subject = "anyhow"
reason = "QueryExpressionV1::validate, validate_field, evaluate_filter, parse_promql, split_matchers, parse_decimal_seconds_nanos and validate_id return anyhow errors whose text is the API's invalid_query and Prometheus bad_data message that tests match by substring, and the cursor, time and PromQL budget helpers spell Result<_, ApiError> through anyhow::Result; converting them is not a move (E6). P2: a query domain error (thiserror) with the same Display text, which the handlers convert, and std Result for the ApiError helpers."

[[exceptions]]
rule = "B2"
paths = ["src/query/domain/query_cursor.rs"]
subject = "base64"
reason = "encode_query_cursor and decode_query_cursor write the opaque page cursor as base64url (URL_SAFE_NO_PAD) JSON; the cursor text is the API's wire and clients hand it back, so P1 moves the codec as-is. P2: the domain keeps the cursor as a typed value and an interfaces codec writes and reads the base64url text, or base64 is approved in the domain allowlist."

[[exceptions]]
rule = "B2"
paths = ["src/query/domain/query_time.rs"]
subject = "chrono::Utc::now"
reason = "cold_query_requested compares the query's start with Utc::now minus 30 days to decide whether the archive is read; P1 moves it without rewriting it (E7). P2: it takes now as an argument and the application reads it from a Clock port."

[[exceptions]]
rule = "B3"
paths = [
  "src/query/domain/query_job.rs",
  "src/query/domain/query_time.rs",
]
subject = "domain->interfaces"
reason = "QueryJobV1 stores the job's QueryRequestV1 and its Option<QueryResponseV1>, and cold_query_requested reads a QueryRequestV1's time range; §2 puts QueryRequestV1 and QueryResponseV1 in interfaces/http as the API's wire schemas and wins over layer_deps here. P2: a domain query and result model the V1 wire types map to and from at the HTTP edge, or QueryRequestV1 and QueryResponseV1 approved as the query's published language in the domain."

[[exceptions]]
rule = "B3"
paths = [
  "src/query/application/archive_query_status.rs",
  "src/query/application/execute_query.rs",
]
subject = "application->interfaces"
reason = "execute_query_v1 takes a QueryRequestV1 and matches its QuerySignalV1 and MetricFunctionV1, and it and apply_archive_query_status build a QueryResponseV1; §2 puts those wire schemas in interfaces/http and wins over layer_deps here. P2: the use case takes and returns the domain query and result model, and the handler maps the V1 wire types onto it."

[[exceptions]]
rule = "B3"
paths = [
  "src/query/infrastructure/file_query_job_store.rs",
  "src/query/infrastructure/sift_api_client.rs",
  "src/query/infrastructure/store_query_client.rs",
]
subject = "infrastructure->interfaces"
reason = "QueryJobStore::create takes a QueryRequestV1 and succeed (and its JobState impl) a QueryResponseV1, forward_query_to_store and decode_store_query_response send a QueryRequestV1 and decode a QueryResponseV1, and SiftApiClient sends QueryRequestV1 (checking its QueryModeV1), CorrelationRequestV1 and LogTailRequestV1 and decodes QueryResponseV1; §2 puts those wire schemas in interfaces/http and wins over layer_deps here. P2: the store and the store client hold the domain query and result model, and the API client's wire types become its own or the published language."

[[exceptions]]
rule = "B3"
paths = [
  "src/query/interfaces/http/correlate_v1.rs",
  "src/query/interfaces/http/phase_one.rs",
  "src/query/interfaces/http/prom_query_params.rs",
  "src/query/interfaces/http/prometheus_query.rs",
  "src/query/interfaces/http/query_request_v1.rs",
  "src/query/interfaces/http/query_role_router.rs",
  "src/query/interfaces/http/query_v1.rs",
]
subject = "interfaces->domain"
reason = "The handlers and wire types P1 moves whole read the domain directly: QueryRequestV1 and the phase-one requests embed QueryExpressionV1 and validate with validate_field and MAX_FILTER_ARGUMENTS, correlate_v1 parses times with parse_query_time_nanos, query_v1 encodes cursors with encode_query_cursor and reads QueryJobV1 as query_role_router does, prom_query_params parses with parse_decimal_seconds_nanos, and the Prometheus handlers run parse_promql, PromFunction and the promql_evaluator helpers (PROM_LOOKBACK_NANOS, PROM_MAX_RANGE_EVALUATIONS, prom_latest_values, prom_rate_values and the rest) inline. P2: the instant and range evaluation, correlation, tail and job lookup move behind application use cases the handlers call, and the V1 wire types map QueryExpressionV1 at the edge or it is approved as published language."

[[exceptions]]
rule = "B3"
paths = [
  "src/query/interfaces/http/query_role_router.rs",
  "src/query/interfaces/mcp/mcp_transport.rs",
  "src/query/interfaces/mcp/sift_mcp_server.rs",
]
subject = "interfaces->infrastructure"
reason = "query_role_query_v1 calls forward_query_to_store and decode_store_query_response, and serve_stdio and http_router build the SiftApiClient that SiftMcpServer holds and calls; P1 moves the handlers and the MCP server whole. P2: application ports for forwarding a query to the store and for reaching the Sift API, with the composition root injecting store_query_client and SiftApiClient behind them."

[[exceptions]]
rule = "B4"
paths = ["src/query/domain/promql_evaluator.rs"]
subject = "projection.domain"
reason = "ensure_complete_prom_metric_page, prom_series_labels, prom_latest_values and prom_rate_values evaluate over projection's MetricPage, MetricSeriesResultV1 and MetricPointV1 and read MAX_METRIC_QUERY_LIMIT; P1 moves the evaluator as-is. P2: the evaluator works on query-owned series and points that the application maps from projection's published query results."

[[exceptions]]
rule = "B4"
paths = [
  "src/query/application/execute_query.rs",
  "src/query/application/prom_query.rs",
  "src/query/interfaces/http/correlate_v1.rs",
  "src/query/interfaces/http/get_trace.rs",
  "src/query/interfaces/http/phase_one.rs",
  "src/query/interfaces/http/prometheus_query.rs",
]
subject = "projection.domain"
reason = "Queries are answered by the projections: execute_query_v1, prom_metric_query and correlate_v1 build LogQuery, MetricQuery and TraceQuery with the MAX_*_QUERY_LIMIT bounds, catch up on PROJECTION_LOGGING_STORE, PROJECTION_METRIC_STORE and PROJECTION_TRACE_STORE, and the responses carry LogRecordV1, MetricSeriesResultV1 and TraceResultV1; P1 moves them as-is. P2: projection's application exposes the read use cases with the queries, pages and *V1 records as its published language, and query calls through them."

[[exceptions]]
rule = "B4"
paths = ["src/query/application/execute_query.rs"]
subject = "projection.infrastructure"
reason = "execute_query_v1 replays the archive into fresh LoggingProjection, MetricProjection and TraceProjection instances to answer a cold query; P1 moves it whole. P2: projection's application offers an archive-replay read use case, and the cold path calls it instead of building the projections."

# Ingest: telemetry admitted within bounded limits, decoded from OTLP, Cloud
# Logging structured JSON and Prometheus remote write into operational
# events, governed, and appended through the group-commit queue to the
# journal. Besides the shared kernel it appends through DurableJournal and
# ServiceState, still crate-root items until commits 6 and 11.
[[contexts]]
name = "ingest"
depends_on = []

[contexts.layers]
domain = "src/ingest/domain"
application = "src/ingest/application"
infrastructure = "src/ingest/infrastructure"
interfaces = "src/ingest/interfaces"

# Ingest dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B1"
paths = ["src/ingest/batch.rs"]
subject = "src/ingest/batch"
reason = "Compat facade: sift::ingest::batch was a public module, and batch.rs now only re-exports the event batch schemas, decode_item and event_id_hint from interfaces/http/batch.rs so the public path keeps compiling. P2: drop the facade once callers use the ingest root re-exports or the layer paths."

[[exceptions]]
rule = "B1"
paths = ["src/ingest/gcp.rs"]
subject = "src/ingest/gcp"
reason = "Compat facade: sift::ingest::gcp was a public module, and gcp.rs now only re-exports looks_like_structured_log and normalize_structured_log from infrastructure/gcp.rs so the public path keeps compiling. P2: drop the facade once callers use the layer path or an ingest root re-export."

[[exceptions]]
rule = "B1"
paths = ["src/ingest/limits.rs"]
subject = "src/ingest/limits"
reason = "Compat facade: sift::ingest::limits was a public module, and limits.rs now only re-exports AdmissionController, AdmissionPermit, AdmissionError and IngestLimits from their layers so the public path keeps compiling. P2: drop the facade; the ingest root already re-exports all four."

[[exceptions]]
rule = "B1"
paths = ["src/ingest/otlp.rs"]
subject = "src/ingest/otlp"
reason = "Compat facade: sift::ingest::otlp was a public module, and otlp.rs now only re-exports the OTLP codec from interfaces/otlp/otlp_codec.rs and transport_otlp's proto (as wire), OtlpMediaType and OtlpSignal; the bin's acceptance payloads and tests/it/acceptance_payload_cli.rs still name sift::ingest::otlp::wire. P2: those callers use transport_otlp::proto directly and the facade goes."

[[exceptions]]
rule = "B2"
paths = [
  "src/ingest/domain/governance_policy.rs",
  "src/ingest/domain/ingest_limits.rs",
  "src/ingest/domain/raft_batch_splitter.rs",
]
subject = "anyhow"
reason = "GovernancePolicy's and GovernancePolicySet's validate, GovernancePolicySet::govern, IngestLimits::validate and split_governed_batches return anyhow errors whose text is the startup error for a bad policy file or limit and the append failure the API reports, so converting them is not a move (E6). P2: an ingest domain error (thiserror) with the same Display text, which the application and the bin convert."

[[exceptions]]
rule = "B2"
paths = ["src/ingest/domain/admission_error.rs"]
subject = "axum"
reason = "AdmissionError carries the axum StatusCode each refusal answers with (400, 413, 429, 503), which the admission controller and the body decoder set and ApiError::from_admission copies into the response; P1 moves it as-is. P2: AdmissionError holds a domain refusal kind and the interfaces map the kind to an HTTP status and a gRPC code."

[[exceptions]]
rule = "B3"
paths = ["src/ingest/application/append_events.rs"]
subject = "application->infrastructure"
reason = "ServiceState::append_events wraps each governed chunk in an IngestBatchRequest and submits it to the group-commit queue that ingest_batch_queue starts on IngestBatchCoordinator; P1 moves the use case whole. P2: an application port for submitting a batch, with the composition root injecting the coordinator behind it."

[[exceptions]]
rule = "B3"
paths = ["src/ingest/interfaces/http/batch.rs"]
subject = "interfaces->infrastructure"
reason = "decode_item routes a Cloud Logging structured entry through gcp::looks_like_structured_log and gcp::normalize_structured_log before the plain event path; P1 moves the batch schemas and decode_item whole. P2: an application use case that decodes a batch item, with the GCP normalizer injected behind a port."

[[exceptions]]
rule = "B3"
paths = [
  "src/ingest/interfaces/http/prometheus_remote_write.rs",
  "src/ingest/interfaces/http/request_body_decoder.rs",
  "src/ingest/interfaces/otlp/json_logs_decoder.rs",
  "src/ingest/interfaces/otlp/json_metrics_decoder.rs",
  "src/ingest/interfaces/otlp/json_traces_decoder.rs",
  "src/ingest/interfaces/otlp/proto_logs_decoder.rs",
  "src/ingest/interfaces/otlp/proto_metrics_decoder.rs",
  "src/ingest/interfaces/otlp/proto_traces_decoder.rs",
]
subject = "interfaces->domain"
reason = "The remote-write handler and AdmissionController::decode_body build AdmissionError refusals, and the OTLP decoders derive each event's id with stable_id; P1 moves the handler and the decoders whole. P2: the application re-exports AdmissionError and an event-id service the decoders call, or decoding moves behind an application use case, so the interfaces reach the domain only through the application."
