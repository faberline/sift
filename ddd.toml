subject = "ingest.domain"
reason = "DurableJournal holds the GovernancePolicySet it governs every appended event with (open reads it from the environment and recover validates it), and append_governed_batch reserves local capacity with ingest's storage_reservation; declaring ingest in depends_on would close a journal-ingest cycle, since ingest appends to the journal. P2: ingest governs events before the append, or governance reaches the journal through a domain port, and storage_reservation moves to the journal or node, which breaks the cycle."

[[exceptions]]
rule = "B4"
paths = [
  "src/journal/application/adopt_archive.rs",
  "src/journal/application/append_durable_batch.rs",
  "src/journal/application/apply_retention_expiration.rs",
  "src/journal/application/dedupe_window.rs",
  "src/journal/application/query_events.rs",
  "src/journal/application/recover_journal.rs",
  "src/journal/infrastructure/blob_reference_scan.rs",
  "src/journal/infrastructure/journal_projection_read_session.rs",
  "src/journal/infrastructure/raft/archive_checkpoint.rs",
  "src/journal/infrastructure/raft/archive_checkpoint_install.rs",
  "src/journal/infrastructure/raft/local_checkpoint.rs",
  "src/journal/infrastructure/raft/raft_state_machine_impl.rs",
  "src/journal/infrastructure/raft/sift_state_machine.rs",
  "src/journal/infrastructure/raft/sift_state_machine_checkpoints.rs",
]
subject = "archive.application"
reason = "The journal reads the archive's committed state throughout: recovery, append, the dedupe window, retention expiration, query_events, the blob reference scan and the state machine read committed_watermarks, committed_status, local_committed_status and remote_retained_state; recovery reconciles retention (reconcile_committed_retention) and resumes local blob GC (resume_local_blob_gc_batch, finish_local_blob_gc); the dedupe window replays archived receipts (replay_recent_committed_events, replay_recent_committed_receipts); query_events and the projection read session read archived events (read_committed_events_after, CommittedEventReader); and the Raft state machine archives locally, evicts, expires, restores and adopts archive checkpoints (archive_journal_local, evict_committed_cold_segments_at, expire_committed_events_at, restore_gcs, ArchiveReceipt, ExpirationReceipt). declaring archive in depends_on would close a journal-archive cycle, since the archive archives, evicts and expires the journal's segments. P2: an archive port in the journal's domain (committed watermarks and status, archived-event reader, checkpoint adoption) that the archive implements, which breaks the cycle."

[[exceptions]]
rule = "B4"
paths = [
  "src/journal/application/adopt_archive.rs",
  "src/journal/application/recover_journal.rs",
  "src/journal/infrastructure/raft/archive_checkpoint.rs",
  "src/journal/infrastructure/raft/archive_checkpoint_install.rs",
]
subject = "archive.infrastructure"
reason = "Recovery and the archive-checkpoint adoption and install run the archive's control-record steps directly: adopt_verified_archive_receipt, cleanup_orphan_spills, reconcile_staged_archive_gc, install_archive_gc_plan and withhold_archive_gc_plan; declaring archive in depends_on would close a journal-archive cycle, since the archive archives, evicts and expires the journal's segments. P2: the same archive port exposes these steps from the archive's application, and the journal stops reaching its infrastructure."

[[exceptions]]
rule = "B4"
paths = [
  "src/journal/application/restore_journal.rs",
  "src/journal/infrastructure/raft/archive_checkpoint.rs",
  "src/journal/infrastructure/raft/archive_checkpoint_install.rs",
]
subject = "archive.domain"
reason = "Restore and the Raft archive-checkpoint install hold the ArchiveManifest they adopt and check it with validate_archive_manifest; declaring archive in depends_on would close a journal-archive cycle, since the archive archives, evicts and expires the journal's segments. P2: the archive port validates and adopts the manifest, or ArchiveManifest becomes shared kernel as the journal-archive published language."

# The archive: Sift's cold tier. It uploads the journal's sealed segments,
# blobs and dedupe receipts to GCS or a local archive under a verified
# manifest, evicts archived segments from the hot tier, expires events past
# retention, garbage-collects blobs once every voter has checkpointed, restores
# an empty node from the archive, and replays archived events to cold queries.
# Its workers run the archive and lifecycle ticks. Besides the shared kernel
# it reads the journal it archives and restores into the node's data root.
[[contexts]]
name = "archive"
depends_on = ["journal", "node"]

[contexts.layers]
domain = "src/archive/domain"
application = "src/archive/application"
infrastructure = "src/archive/infrastructure"
interfaces = "src/archive/interfaces"

# Archive dependencies the P1 split moves as-is; P2 settles each one as the
# reason says.

[[exceptions]]
rule = "B2"
paths = [
  "src/archive/domain/archive_event_time.rs",
  "src/archive/domain/archive_manifest_validator.rs",
  "src/archive/domain/blob_hash_set.rs",
  "src/archive/domain/event_set_digest.rs",
]
subject = "anyhow"
reason = "validate_archive_manifest, validate_dedupe_receipt, parse_optional_archive_time, event_time_unix_nano, acknowledgement_time_unix_nano, acknowledgement_time_bounds, decode_event_id_digest and decode_event_content_digest return anyhow errors whose text is the restore, checkpoint-install and replay failure an invalid manifest, receipt, timestamp or digest raises, and BlobHashSet's insert_hash and contains_hash return anyhow::Result because SpillCatalog's implementation reads spill files; converting them is not a move (E6). P2: an archive domain error (thiserror) with the same Display text, which the application converts, and BlobHashSet takes an associated error type."

[[exceptions]]
rule = "B2"
paths = [
  "src/archive/domain/archive_manifest.rs",
  "src/archive/domain/archive_manifest_validator.rs",
]
subject = "storage_segment"
reason = "ArchiveManifest stores catalog_root and gc_plan_root as storage_segment::CatalogRoot, the serialized manifest's own field type, and validate_archive_manifest checks page_bytes_limit against storage_segment::DEFAULT_CATALOG_PAGE_BYTES; the manifest JSON is the archive's format in GCS and on disk, so P1 moves it as-is. P2: approve CatalogRoot as published language in the domain allowlist, or the domain holds its own catalog-root value that the infrastructure maps to and from CatalogRoot, with the page limit passed in."

[[exceptions]]
rule = "B2"
paths = ["src/archive/domain/archive_manifest_validator.rs"]
subject = "service_backup"
reason = "validate_archive_manifest parses each gc_object_uris entry with service_backup::GcsSink::from_exact_uri, the parser the upload uses; P1 moves it as-is. P2: the domain checks the gs:// URI shape itself, and the application runs the GcsSink parse after the domain validation."

[[exceptions]]
rule = "B3"
paths = [
  "src/archive/application/archive_journal_local.rs",
  "src/archive/application/archive_journal_to_gcs.rs",
  "src/archive/application/archive_status_queries.rs",
  "src/archive/application/committed_event_reader.rs",
  "src/archive/application/evict_cold_segments.rs",
  "src/archive/application/expire_committed_events.rs",
  "src/archive/application/finalize_archive_gc.rs",
  "src/archive/application/inspect_archive_catalog.rs",
  "src/archive/application/reconcile_committed_retention.rs",
  "src/archive/application/replay_committed_events.rs",
  "src/archive/application/replay_recent_committed.rs",
  "src/archive/application/restore_gcs.rs",
  "src/archive/application/restore_into_empty.rs",
  "src/archive/application/resume_local_blob_gc.rs",
