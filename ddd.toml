subject = "chrono::Utc::now"
reason = "SiftCommandV1::append_events_now stamps acknowledged_at with Utc::now for the diagnostics encoders; P1 moves it without rewriting it (E7). P2: the diagnostics take the time from a Clock port and pass it to append_events_at, and append_events_now goes."

[[exceptions]]
rule = "B3"
paths = [
  "src/journal/application/adopt_archive.rs",
  "src/journal/application/append_durable_batch.rs",
