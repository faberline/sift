[package]
name = "sift"
version = "0.1.2"
edition = "2021"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
license = "MIT"
repository = "https://github.com/faberline/sift"
description = "Sift — one SRE product for logs, metrics, and traces"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
axum = { version = "0.8", features = ["ws"] }
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
base64 = "0.22"
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string", "env"] }
crc32fast = "1"
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false, features = ["online", "k8s"] }
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14", version = "0.5" }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs", "metrics", "trace"] }
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }
flate2 = "1"
hex = "0.4"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
index-text = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
prost = "0.13"
prost14 = { package = "prost", version = "0.14" }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14", features = ["k8s"] }
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14", features = ["http-client"] }
service-collector = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-executor = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
storage-durable = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
storage-object = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
storage-segment = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-mcp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
metrics-remote-write = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-observability = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-projection = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
raft-core = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
schemars = "0.8"
schemars1 = { package = "schemars", version = "1.2" }
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["gzip"] }
transport-otlp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
tower = "0.5"
tracing = "0.1"
thiserror = "2.0"
tempfile = "3"
url = "2.5"
utoipa = { version = "4", features = ["axum_extras"] }

[dev-dependencies]
rustls = "0.23"
rcgen = "0.13"
serde_yaml = "0.9"
vat = { git = "https://github.com/faberline/vat", rev = "1ba31b2f2ddc49bad1d85a03f889a164227667c9", default-features = false, features = ["emulator"] }

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
