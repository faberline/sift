# HANDWRITE-BEGIN gap="sift-vat-real-service-runner" tracker="1607" reason="Define the COW workspace and real Sift service runner used by operational evidence."
version = 1
name = "sift-operational"
default_runner = "ec-stability"

[workspace]
base = "."
workdir = "."
keep = "always"

[[services]]
id = "sift"
cmd = ["sh", "-c", "CARGO_TARGET_DIR=\"$VAT_WORKSPACE_BASE/target\" cargo build -p sift --bin sift && exec \"$VAT_WORKSPACE_BASE/target/debug/sift\" serve --host 127.0.0.1 --data-dir \"/tmp/sift-vat-data-$$\""]
ready_http = "http://127.0.0.1:7380/healthz"
timeout_s = 600

[[runners]]
id = "ec-security"
requires = ["sift"]
cmd = ["sh", "-c", "export CARGO_TARGET_DIR=\"$VAT_WORKSPACE_BASE/target\" && exec cargo test -p sift --test it -- runtime_security_e2e:: --nocapture"]
timeout_s = 600

[[runners]]
id = "ec-stability"
requires = ["sift"]
cmd = ["sh", "-c", "export CARGO_TARGET_DIR=\"$VAT_WORKSPACE_BASE/target\" && exec cargo test -p sift --test it -- stability_e2e:: --nocapture"]
timeout_s = 600

# Set SIFT_VAT_BIN_DIR to the absolute directory containing the five pinned
# executables from scripts/ci/online-dependencies.lock.json.
# The PATH above is machine-specific. Set CARGO and, if needed, RUSTC to the
# absolute executable paths for the pinned toolchain on your machine.
# Run with vat run --keep never vat-producers to remove the outer VAT as well.
[[runners]]
id = "vat-producers"
cmd = ["sh", "-ec", "test -n \"$SIFT_VAT_BIN_DIR\"; export CARGO_TARGET_DIR=\"${CARGO_TARGET_DIR:-$VAT_WORKSPACE_BASE/target}\"; exec \"${CARGO:-cargo}\" test --locked -p sift --test it -- vat_service_observability_e2e::vat_managed_service_stdout_reaches_real_sift_query --exact --ignored --nocapture"]
timeout_s = 1200
# HANDWRITE-END
