apiVersion: apps/v1
kind: Deployment
metadata:
  name: sift-operator
  namespace: sift-system
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sift-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sift-operator }
    spec:
      serviceAccountName: sift-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/faberline/sift:0.3.0
          imagePullPolicy: IfNotPresent
          args: ["k8s", "operator", "run"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
