        - path: {type: PathPrefix, value: /api/v1/saved-queries}
        - path: {type: PathPrefix, value: /api/v1/error-groups}
        - path: {type: PathPrefix, value: /api/v1/alert-rules}
        - path: {type: PathPrefix, value: /api/v1/alerts}
      backendRefs:
        - name: sift-gateway
          port: 7380
