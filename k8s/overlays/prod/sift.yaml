# HANDWRITE-BEGIN gap="sift-kustomize-prod-instance" tracker="1606" reason="Use the fixed three-store and three-control production topology. Size storage from application samples before deployment."
apiVersion: sift.axiom.dev/v1alpha1
kind: Sift
metadata:
  name: sift
  namespace: production
spec:
  image: REPLACE_ME__SIFT_IMAGE_DIGEST
  peerTlsSecret: REPLACE_ME__SIFT_PEER_TLS_SECRET
  replicasPerShard: 3
  voterCount: 3
  archive:
    destination: REPLACE_ME__GCS_ARCHIVE_URI
  storage:
    storeSize: 50Gi
    controlSize: 5Gi
    gatewaySize: 2Gi
    querySize: 2Gi
  ingest:
    maxItemsPerMinute: 720000
    maxConcurrentRequests: 32
  auth: kubernetes
  gcpProjectId: REPLACE_ME__GCP_PROJECT_ID
  gkeClusterName: REPLACE_ME__GKE_CLUSTER_NAME
  gkeLocation: REPLACE_ME__GKE_LOCATION
# HANDWRITE-END
