apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sift-single-node
resources:
  - ../../operator
  - sift.yaml
configurations:
  - images-config.yaml
patches:
  - target: {kind: Namespace, name: sift-system}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: sift-system
  - target: {kind: Deployment, name: sift-operator}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/image, value: sift}
      - {op: add, path: /spec/template/spec/nodeSelector, value: {faberline.dev/pool: sift-server}}
      - {op: add, path: /spec/template/spec/tolerations, value: [{key: faberline.dev/pool, operator: Equal, value: sift-server, effect: NoSchedule}]}
      - {op: add, path: /spec/template/spec/imagePullSecrets, value: [{name: ghcr-pull}]}
