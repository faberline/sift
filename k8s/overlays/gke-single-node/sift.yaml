apiVersion: sift.axiom.dev/v1alpha1
kind: Sift
metadata:
  name: sift
spec:
  image: sift
  topology: singleNode
  auth: "off"
  logs:
    agent: disabled
  placement:
    nodeSelector:
      faberline.dev/pool: sift-server
    tolerations:
      - key: faberline.dev/pool
        operator: Equal
        value: sift-server
        effect: NoSchedule
  storage:
    storageClass: dynamic-rwo
    storeSize: 242Gi
