apiVersion: v1
kind: Service
metadata:
  name: sift-smoke
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sift-smoke
  ports:
    - name: http
      port: 7380
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sift-smoke
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sift-smoke
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sift-smoke-probe
      ports:
        - protocol: TCP
          port: 7380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sift-smoke
spec:
  replicas: 1
  serviceName: sift-smoke
  selector:
    matchLabels:
      app.kubernetes.io/name: sift-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sift-smoke
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        faberline.dev/pool: sift-server
      tolerations:
        - key: faberline.dev/pool
          operator: Equal
          value: sift-server
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data-root
          image: docker.io/library/python:3.13-alpine@sha256:d76f585fb0d5107dd47143da5e61554fd9cae656a30f3470f815cb8475769b6a
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/sift/data
              chown 65532:65532 /var/lib/sift/data
              chmod 0700 /var/lib/sift/data
              test "$(stat -c '%u:%g:%a' /var/lib/sift/data)" = '65532:65532:700'
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sift
      containers:
        - name: sift
          image: sift
          args: [serve, --role, all, --data-dir, /var/lib/sift/data]
          env:
            - name: SIFT_AUTH
              value: "off"
          ports:
            - name: http
              containerPort: 7380
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sift
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: dynamic-rwo
        resources:
          requests:
            storage: 4Gi
