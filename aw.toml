[project]
name = "sift"
cap_path = "README.md"
label = "app:sift"

[capability.profile]
traits = ["service", "long_running", "cli_facing", "competitive_replacement", "network_exposed", "http2_api", "kubernetes_native", "stateful_storage"]

[[workspaces]]
name = "sift"
paths = ["**"]
target = "rust"
test_cmd = "cargo test -p sift"

[standards.coverage]
line = 0.00   # no local measure: cargo llvm-cov failed on large_archive_lifecycle (reserve local WAL capacity, sandbox disk 96% full); COV4 in CI names the value
target = 100
