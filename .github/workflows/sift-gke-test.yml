name: sift-gke-test

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Sift PR number with a current trusted verdict
        required: true
        type: string
      verifier_run:
        description: Successful sift-pr-verifier run ID for that PR head
        required: true
        type: string

permissions: {}
concurrency:
  group: sift-gke-smoke
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the current PR and its trusted verdict
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
          VERIFIER_RUN: ${{ inputs.verifier_run }}
        run: |
          python3 -B scripts/ci/gke_candidate.py --pull-request "$PR_NUMBER" \
            --verifier-run "$VERIFIER_RUN" --output "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      SIFT_SOURCE_REVISION: ${{ needs.resolve.outputs.source_sha }}
      LOCAL_IMAGE: sift-gke-candidate:verified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.1
          targets: x86_64-unknown-linux-musl
      - name: Build and check the exact Linux image without registry access
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SIFT_SOURCE_REVISION" ]]
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --locked -p sift --bin sift --target x86_64-unknown-linux-musl
          stage="$RUNNER_TEMP/sift-image-stage"
          install -D -m 0755 target/x86_64-unknown-linux-musl/release/sift "$stage/dist/linux/amd64/sift"
          docker build --platform linux/amd64 --provenance=false --build-arg SOURCE=staged \
            --file Dockerfile.release --tag "$LOCAL_IMAGE" "$stage"
          docker run --rm "$LOCAL_IMAGE" acceptance-build-info \
            | jq -e --arg source "$SIFT_SOURCE_REVISION" '.git_sha == $source'

          container="$(docker run -d -p 127.0.0.1::7380 -e SIFT_AUTH=off "$LOCAL_IMAGE" serve --role all)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port="$(docker port "$container" 7380/tcp)"
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 1 \
            --max-time 3 "http://$port/readyz"

          mkdir "$RUNNER_TEMP/sift-image"
          cd "$RUNNER_TEMP/sift-image"
          docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}' > image.id
          docker save "$LOCAL_IMAGE" -o image.tar
          sha256sum image.tar image.id > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sift-gke-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-image/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sift-gke-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-image
      - name: Publish the tested image by digest
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sift-image"
          sha256sum -c SHA256SUMS
          image_id="$(cat image.id)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load -i image.tar
          [[ "$(docker image inspect sift-gke-candidate:verified --format '{{.Id}}')" == "$image_id" ]]
          repository=ghcr.io/faberline/sift
          tag="gke-${SOURCE_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker tag "$image_id" "$repository:$tag"
          docker push "$repository:$tag"
          image="$(docker image inspect "$repository:$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -E '^ghcr\.io/faberline/sift@sha256:[0-9a-f]{64}$')"
          [[ "$image" =~ ^ghcr\.io/faberline/sift@sha256:[0-9a-f]{64}$ ]]
          registry_id="$(docker buildx imagetools inspect --raw "$image" | jq -er '.config.digest')"
          [[ "$registry_id" == "$image_id" ]]
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Source %s\n\nTest image %s\n' "$SOURCE_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@d7955702e3596b7d3b7eafd232644d1159f4b812
    with:
      aw-ref: d7955702e3596b7d3b7eafd232644d1159f4b812
      image: ${{ needs.publish.outputs.image }}
      image-name: sift
      namespace: sift-smoke
      lane: smoke
      overlay: k8s/overlays/gke-test
      test-job: k8s/gke-test-job/smoke
      ttl-minutes: 60
