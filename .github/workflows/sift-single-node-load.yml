name: sift-single-node-load

on:
  workflow_dispatch:
    inputs:
      step_seconds:
        description: "Seconds for each rate step (default 180)."
        required: false
        default: "180"
        type: string

permissions:
  contents: read

concurrency:
  group: sift-single-node-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.1
      - name: Build sift
        run: cargo build --release --locked --bin sift
      - name: Run the local load driver
        env:
          STEP_SECONDS: ${{ inputs.step_seconds }}
        run: python3 -B scripts/single_node/run_local_load.py --sift-bin target/release/sift --output-dir "$RUNNER_TEMP/single-node-load" --step-seconds "$STEP_SECONDS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-node-load-result
          path: ${{ runner.temp }}/single-node-load/result.json
          if-no-files-found: error
