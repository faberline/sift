name: sift-single-node-load

on:
  workflow_dispatch:
    inputs:
      step_seconds:
        description: "Seconds for each rate step (default 180)."
        required: false
        default: "180"
        type: string
      soak_rate:
        description: "Soak mode: items per second held constant (empty: normal rate steps)."
        required: false
        default: ""
        type: string
      soak_seconds:
        description: "Soak mode: seconds to hold the rate (empty: 600). Needs soak_rate."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sift-single-node-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.1
      - name: Build sift
        run: cargo build --release --locked --bin sift
      - name: Run the local load driver
        env:
          STEP_SECONDS: ${{ inputs.step_seconds }}
          SOAK_RATE: ${{ inputs.soak_rate }}
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/single-node-logs"
          SOAK_ARGS=()
          if [ -n "$SOAK_RATE" ]; then SOAK_ARGS+=(--soak-rate "$SOAK_RATE" --soak-seconds "${SOAK_SECONDS:-600}"); fi
          python3 -u -B scripts/single_node/run_local_load.py --sift-bin target/release/sift --output-dir "$RUNNER_TEMP/single-node-load" --step-seconds "$STEP_SECONDS" "${SOAK_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/single-node-logs/driver.log"
      - name: Collect the Sift server log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/single-node-logs"
          if [ -f "$RUNNER_TEMP/single-node-load/server.log" ]; then cp "$RUNNER_TEMP/single-node-load/server.log" "$RUNNER_TEMP/single-node-logs/server.log"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: single-node-load-logs
          path: ${{ runner.temp }}/single-node-logs
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-node-load-result
          path: ${{ runner.temp }}/single-node-load/result.json
          if-no-files-found: error
