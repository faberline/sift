name: sift-pr-verifier
on:
  workflow_run:
    workflows: [sift-pr-tests]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run loads this workflow from default branch, not the PR.
      # Bootstrap must be human-reviewed and landed before this is a trust anchor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify data only, from the fixed trusted workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
          SIFT_VERIFIER_REVISION: ${{ github.workflow_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/ci/verify_online.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sift-trusted-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-trusted-verdict.json
          retention-days: 3
          if-no-files-found: error
