name: sift-prometheus-comparison

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: sift-prometheus-comparison
  cancel-in-progress: false

jobs:
  comparison:
    name: "comparison: sift against Prometheus 3.16.0"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build sift
        shell: bash
        run: cargo build --locked -p sift --bin sift
      - name: run comparison
        shell: bash
        env:
          COMPARISON_OUT: ${{ runner.temp }}/prometheus-comparison.json
        run: bash tests/perf/prometheus_comparison.sh
      - name: write the step summary
        if: always()
        shell: bash
        env:
          COMPARISON_OUT: ${{ runner.temp }}/prometheus-comparison.json
        run: |
          set -euo pipefail
          if [[ -f "$COMPARISON_OUT" ]]; then
            {
              echo '```json'
              cat "$COMPARISON_OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload the comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sift-prometheus-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prometheus-comparison.json
          if-no-files-found: warn
          retention-days: 30
