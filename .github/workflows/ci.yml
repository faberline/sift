name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-sift:
    name: "test: sift"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build
        run: cargo build --locked -p sift --bins
      - name: candidate entrypoint
        run: bash tests/candidate_root.sh
      - name: cargo test
        run: cargo test --locked -p sift
      - name: core build stamp
        run: bash scripts/faberline-core-test.sh build-stamp --lib

  test-ignored:
    name: "test: ignored (it)"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: prepare pinned sources
        run: bash scripts/ci/prepare-ignored.sh
      - name: ignored inventory
        run: |
          n=$(cargo test --locked -p sift --test it -- --ignored --list | grep -c ': test$')
          [ "$n" -eq 24 ]
      - name: ignored tests
        run: cargo test --locked -p sift --test it -- --ignored --test-threads=1

  test-compat:
    name: "test: compat"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: docker setup
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: build sift binary
        run: cargo build --locked -p sift --bin sift
      - name: compatibility bytes
        run: "cargo test --locked -p sift --test it -- refactor_compatibility::"
      - name: prometheus compliance
        run: bash tests/prometheus_compliance.sh

  test-docker:
    name: "test: docker named volume"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: docker setup
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: docker named volume
        run: bash tests/docker_named_volume.sh

  test-artifacts:
    name: "test: deployment artifacts"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.26.0
      - name: deployment artifacts
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/verify-deployment-artifacts.py
      - name: configuration page unit tests
        working-directory: scripts
        run: '"$RUNNER_TEMP/venv/bin/python" -B -m unittest test_verify_configuration_doc -v'
      - name: build sift binary
        run: cargo build --locked -p sift --bin sift
      - name: configuration page check
        run: '"$RUNNER_TEMP/venv/bin/python" -B scripts/verify-configuration-doc.py --sift-bin target/debug/sift'
      - name: restore drill unit tests
        working-directory: k8s/gke-test-job/restore-drill
        run: python3 -m unittest test_drill -v
      - name: smoke unit tests
        working-directory: k8s/gke-test-job/smoke
        run: python3 -m unittest test_smoke -v
      - name: production acceptance unit tests
        working-directory: scripts/production
        run: |
          python3 -B -m unittest test_cost_model -v
          python3 -B -m unittest test_dry_run -v
      - name: production acceptance dry run
        working-directory: scripts/production
        run: python3 -B dry_run.py --fixture
      - name: production acceptance guard unit tests
        working-directory: scripts/production
        run: python3 -B -m unittest test_cost_guard test_check_cleanup -v
      - name: threat model unit tests
        working-directory: scripts/security
        run: python3 -B -m unittest test_threat_model -v
      - name: alert runbook unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_alert_runbook.py' -v
      - name: alert runbook check
        run: python3 -B scripts/verify-alert-runbook.py
      - name: limits doc unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_limits_doc.py' -v
      - name: limits doc check
        run: python3 -B scripts/verify-limits-doc.py
      - name: install doc unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_install_doc.py' -v
      - name: install doc check
        run: python3 -B scripts/verify-install-doc.py
      - name: single-node load driver unit tests
        run: |
          python3 -B scripts/single_node/test_run_local_load.py -v
          python3 -B scripts/single_node/acceptance/test_phases.py -v
          python3 -B scripts/single_node/test_workflow.py -v
          python3 -B scripts/test_single_node_workflow.py -v
      - name: single-node operations doc tests
        run: |
          python3 -B scripts/test_single_node_operations_doc.py -v
          python3 -B scripts/test_single_node_doc.py -v
          python3 -B scripts/test_release_profiles_doc.py -v
          python3 -B scripts/test_log_and_metrics_labels_doc.py -v

  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: cargo build
        run: cargo build --locked -p sift --bins
      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --locked --json --summary-only --output-path target/coverage.json
      - uses: faberline/aw/.github/actions/coverage@4340a382c73351cffff85edba7079e4c24adf3db # S8
        with:
          summary: target/coverage.json

  test-reproducible-image:
    name: "test: reproducible image"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: docker setup
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: reproducible image
        run: bash scripts/release/verify-reproducible-image.sh

  test-perf:
    name: "test: perf (metric workload)"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: checker unit tests
        working-directory: tests/perf
        run: python3 -B -m unittest test_check_regression test_trace_compare -v
      - name: build sift binary
        run: cargo build --locked -p sift --bin sift
      - name: metric workload
        env:
          WORKLOAD_REQUESTS: '50'
          WORKLOAD_ITEMS: '1000'
          WORKLOAD_QUERIES: '21'
          WORKLOAD_OUT: ${{ runner.temp }}/perf-metric.json
        run: bash tests/perf/metric_workload.sh
      - name: upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-metric
          path: ${{ runner.temp }}/perf-metric.json
          if-no-files-found: error
      - name: regression check
        run: python3 -B tests/perf/check_regression.py "$RUNNER_TEMP/perf-metric.json" tests/perf/baseline/metric.json 60 160
      - name: log workload
        env:
          WORKLOAD_REQUESTS: '50'
          WORKLOAD_ITEMS: '1000'
          WORKLOAD_QUERIES: '21'
          WORKLOAD_OUT: ${{ runner.temp }}/perf-log.json
        run: bash tests/perf/log_workload.sh
      - name: upload log result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-log
          path: ${{ runner.temp }}/perf-log.json
          if-no-files-found: error
      - name: log regression check
        run: python3 -B tests/perf/check_regression.py "$RUNNER_TEMP/perf-log.json" tests/perf/baseline/log.json 60 150 --ignore query_p99_ms
      - name: build base binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/base-target
        run: |
          git worktree add --detach "$RUNNER_TEMP/base-src" HEAD^
          cd "$RUNNER_TEMP/base-src"
          cargo build --locked -p sift --bin sift
      - name: trace workload (base and head, 5 runs each)
        env:
          WORKLOAD_REQUESTS: '50'
          WORKLOAD_ITEMS: '1000'
          WORKLOAD_QUERIES: '21'
        run: |
          for i in 1 2 3 4 5; do
            SIFT_BIN="$RUNNER_TEMP/base-target/debug/sift" WORKLOAD_OUT="$RUNNER_TEMP/perf-trace-base-$i.json" bash tests/perf/trace_workload.sh
            WORKLOAD_OUT="$RUNNER_TEMP/perf-trace-head-$i.json" bash tests/perf/trace_workload.sh
          done
      - name: trace median
        run: |
          python3 -B tests/perf/median_result.py "$RUNNER_TEMP/perf-trace-base.json" "$RUNNER_TEMP"/perf-trace-base-1.json "$RUNNER_TEMP"/perf-trace-base-2.json "$RUNNER_TEMP"/perf-trace-base-3.json "$RUNNER_TEMP"/perf-trace-base-4.json "$RUNNER_TEMP"/perf-trace-base-5.json
          python3 -B tests/perf/median_result.py "$RUNNER_TEMP/perf-trace-head.json" "$RUNNER_TEMP"/perf-trace-head-1.json "$RUNNER_TEMP"/perf-trace-head-2.json "$RUNNER_TEMP"/perf-trace-head-3.json "$RUNNER_TEMP"/perf-trace-head-4.json "$RUNNER_TEMP"/perf-trace-head-5.json
      - name: upload trace result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-trace
          path: |
            ${{ runner.temp }}/perf-trace-base.json
            ${{ runner.temp }}/perf-trace-head.json
            ${{ runner.temp }}/perf-trace-base-?.json
            ${{ runner.temp }}/perf-trace-head-?.json
          if-no-files-found: error
      # The comparison of this step is the base commit, measured in this job
      # with the same workload on the same machine (faberline/aw#581, option A).
      # The stored trace baseline file is not compared here any more.
      # The threshold 60 is unchanged: head must be at most 160 percent of base.
      - name: trace regression check
        run: python3 -B tests/perf/compare_trace.py "$RUNNER_TEMP/perf-trace-head.json" "$RUNNER_TEMP/perf-trace-base.json" 60

  test-security:
    name: "test: security (deny, architecture)"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny check
      - name: install cargo-audit
        run: cargo install --locked cargo-audit@0.23.0
      - name: cargo audit
        run: cargo audit --db "$RUNNER_TEMP/rustsec-db" --deny warnings
      - name: architecture check
        run: bash scripts/check-architecture.sh
      - name: install aw
        run: cargo install --locked --git https://github.com/faberline/aw --rev 440aa413d467c0d850cf976f277441724852217c aw
      - name: core-reuse check (S4)
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/faberline/core "$RUNNER_TEMP/core"
          aw standards check --repo . --core "$RUNNER_TEMP/core"

  gate:
    name: gate
    if: always()
    needs: [lint, test-sift, test-ignored, test-compat, test-docker, test-artifacts, test-coverage, test-reproducible-image, test-perf, test-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: verify results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
