name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-sift:
    name: "test: sift"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build
        run: cargo build --locked -p sift --bins
      - name: candidate entrypoint
        run: bash tests/candidate_root.sh
      - name: cargo test
        run: cargo test --locked -p sift
      - name: core build stamp
        run: bash scripts/faberline-core-test.sh build-stamp --lib

  test-ignored:
    name: "test: ignored (it)"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: prepare pinned sources
        run: bash scripts/ci/prepare-ignored.sh
      - name: ignored inventory
        run: |
          n=$(cargo test --locked -p sift --test it -- --ignored --list | grep -c ': test$')
          [ "$n" -eq 24 ]
      - name: ignored tests
        run: cargo test --locked -p sift --test it -- --ignored --test-threads=1

  test-compat:
    name: "test: compat"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: docker setup
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: build sift binary
        run: cargo build --locked -p sift --bin sift
      - name: compatibility bytes
        run: "cargo test --locked -p sift --test it -- refactor_compatibility::"
      - name: prometheus compliance
        run: bash tests/prometheus_compliance.sh

  test-docker:
    name: "test: docker named volume"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: docker setup
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: docker named volume
        run: bash tests/docker_named_volume.sh

  test-artifacts:
    name: "test: deployment artifacts"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.26.0
      - name: deployment artifacts
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/verify-deployment-artifacts.py
      - name: configuration page unit tests
        working-directory: scripts
        run: '"$RUNNER_TEMP/venv/bin/python" -B -m unittest test_verify_configuration_doc -v'
      - name: build sift binary
        run: cargo build --locked -p sift --bin sift
      - name: configuration page check
        run: '"$RUNNER_TEMP/venv/bin/python" -B scripts/verify-configuration-doc.py --sift-bin target/debug/sift'
      - name: restore drill unit tests
        working-directory: k8s/gke-test-job/restore-drill
        run: python3 -m unittest test_drill -v
      - name: smoke unit tests
        working-directory: k8s/gke-test-job/smoke
        run: python3 -m unittest test_smoke -v
      - name: production acceptance unit tests
        working-directory: scripts/production
        run: |
          python3 -B -m unittest test_cost_model -v
          python3 -B -m unittest test_dry_run -v
      - name: production acceptance dry run
        working-directory: scripts/production
        run: python3 -B dry_run.py --fixture
      - name: production acceptance guard unit tests
        working-directory: scripts/production
        run: python3 -B -m unittest test_cost_guard test_check_cleanup -v
      - name: alert runbook unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_alert_runbook.py' -v
      - name: alert runbook check
        run: python3 -B scripts/verify-alert-runbook.py
      - name: limits doc unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_limits_doc.py' -v
      - name: limits doc check
        run: python3 -B scripts/verify-limits-doc.py
      - name: install doc unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_install_doc.py' -v
      - name: install doc check
        run: python3 -B scripts/verify-install-doc.py

  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: cargo build
        run: cargo build --locked -p sift --bins
      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --locked --json --summary-only --output-path target/coverage.json
      - uses: faberline/aw/.github/actions/coverage@7ca7c1c8d24f0d29263cc43e7c37987bd853f202 # S8
        with:
          summary: target/coverage.json

  test-reproducible-image:
    name: "test: reproducible image"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: docker setup
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: reproducible image
        run: bash scripts/release/verify-reproducible-image.sh

  test-perf:
    name: "test: perf (metric workload)"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: checker unit tests
        working-directory: tests/perf
        run: python3 -B -m unittest test_check_regression -v
      - name: build sift binary
        run: cargo build --locked -p sift --bin sift
      - name: metric workload
        env:
          WORKLOAD_REQUESTS: '50'
          WORKLOAD_ITEMS: '1000'
          WORKLOAD_QUERIES: '21'
          WORKLOAD_OUT: ${{ runner.temp }}/perf-metric.json
        run: bash tests/perf/metric_workload.sh
      - name: upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-metric
          path: ${{ runner.temp }}/perf-metric.json
          if-no-files-found: error
      - name: regression check
        run: python3 -B tests/perf/check_regression.py "$RUNNER_TEMP/perf-metric.json" tests/perf/baseline/metric.json 60 160
      - name: log workload
        env:
          WORKLOAD_REQUESTS: '50'
          WORKLOAD_ITEMS: '1000'
          WORKLOAD_QUERIES: '21'
          WORKLOAD_OUT: ${{ runner.temp }}/perf-log.json
        run: bash tests/perf/log_workload.sh
      - name: upload log result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-log
          path: ${{ runner.temp }}/perf-log.json
          if-no-files-found: error
      - name: log regression check
        run: python3 -B tests/perf/check_regression.py "$RUNNER_TEMP/perf-log.json" tests/perf/baseline/log.json 60 150 --ignore query_p99_ms

  gate:
    name: gate
    if: always()
    needs: [lint, test-sift, test-ignored, test-compat, test-docker, test-artifacts, test-coverage, test-reproducible-image, test-perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: verify results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
