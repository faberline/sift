name: sift-pr-tests
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions: {}
concurrency:
  group: sift-pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout public exact PR head without an API token
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_BASE" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/faberline/sift.git
          git fetch --quiet --no-tags origin "$PR_HEAD" "$PR_BASE"
          git checkout --quiet --detach "$PR_HEAD"
          python3 -B scripts/ci/pr_identity.py --event "$GITHUB_EVENT_PATH" --head "$PR_HEAD" --output "$RUNNER_TEMP/sift-identity.json"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.1
          enable-cache: false
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.8.2
          set-host: 'true'
          github-token: ''
      - name: Full source-bound verification on hosted runner
        env:
          SIFT_CI_IDENTITY: ${{ runner.temp }}/sift-identity.json
        run: python3 -B scripts/ci/online.py
      - name: Keep bounded sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sift-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-online/evidence/receipt.json
          retention-days: 3
          if-no-files-found: error
