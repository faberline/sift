name: sift-kind

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: sift-kind
  cancel-in-progress: false

jobs:
  kind:
    name: "kind: live journey"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ripgrep
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/kind.sha256sum" https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64.sha256sum
          (cd "$RUNNER_TEMP" && echo "$(cut -d' ' -f1 kind.sha256sum)  kind" | sha256sum -c -)
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version
          kubectl version --client
          docker version
          if ! command -v shasum >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libdigest-sha-perl
          fi
          for tool in awk cargo curl date docker git gzip jq kind kubectl openssl rg sed shasum; do
            command -v "$tool"
          done
      - name: run the Kind journey
        shell: bash
        env:
          SIFT_KIND_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SIFT_KIND_EVIDENCE_DIR: ${{ runner.temp }}/sift-kind-evidence/${{ github.run_id }}-${{ github.run_attempt }}
          SIFT_SOURCE_REVISION: ${{ github.sha }}
        run: scripts/kind-mvp.sh
      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sift-kind-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-kind-evidence/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
