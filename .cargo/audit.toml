# cargo-audit configuration
# Docs: https://rustsec.org/advisories/
#
# Six unmaintained advisories below, plus RUSTSEC-2026-0600 (desk decision,
# faberline/aw#610, option A; sift#404). Re-check all seven by 2027-02-15.
# Keep this list equal to the `ignore` list in deny.toml.

[advisories]
ignore = [
    "RUSTSEC-2025-0012", # backoff 0.4.0 unmaintained; kube-runtime 0.98.0 pulls it in, no replacement yet. Re-check 2027-02-15.
    "RUSTSEC-2024-0384", # instant 0.1.13 unmaintained; backoff pulls it in. Re-check 2027-02-15.
    "RUSTSEC-2025-0134", # rustls-pemfile 2.2.0 unmaintained; kube-client 0.98.0 and core peer-tls pull it in. Re-check 2027-02-15.
    "RUSTSEC-2024-0449", # unsafe-libyaml 0.2.11 unmaintained; serde_yaml 0.9 pulls it in (kube-client, sift, vat dev). Re-check 2027-02-15.
    "RUSTSEC-2025-0141", # bincode 2.0.1 unmaintained; promql-parser 0.11.0 pulls it in (cfgrammar, lrlex, lrpar, lrtable). Re-check 2027-02-15.
    "RUSTSEC-2026-0543", # chrono 0.4.44 unmaintained; arrow-array and parquet 59.2.0, sift and cron pull it in. Re-check 2027-02-15.
    "RUSTSEC-2026-0600", # kube-client 0.98.0 openssl-tls flaw; sift builds rustls-tls, no openssl package in Cargo.lock; fix needs kube 4.2.1/5.2.0 and a core upgrade. Re-check 2027-02-15.
]
